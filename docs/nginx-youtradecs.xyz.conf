map $http_origin $cors_origin {
    default "";
    ~*^https://youtradecs\.xyz$ $http_origin;
    ~*^https://www\.youtradecs\.xyz$ $http_origin;
    ~*^http://localhost(:\d+)?$ $http_origin;
    ~*^http://127\.0\.0\.1(:\d+)?$ $http_origin;
}

server {
    listen 443 ssl;
    server_name youtradecs.xyz www.youtradecs.xyz;
    server_tokens off;

    root /var/www/youtradecs-landing;
    index index.html;

    location = /api/web/v1/overview {
        proxy_pass http://127.0.0.1:21488;
        include proxy_params;
    }

    location = /api/web/v1/overview/deals {
        proxy_pass http://127.0.0.1:21488;
        include proxy_params;
    }

    location = /api/web/v1/overview/documents {
        proxy_pass http://127.0.0.1:21488;
        include proxy_params;
    }

    location = /api/web/v1/steam/currency {
        proxy_pass http://127.0.0.1:21488;
        include proxy_params;
    }

    location ^~ /api/ {
        return 404;
    }

    location ~ ^/webhook/telegram.*$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=UTF-8";
            return 204;
        }

        rewrite ^/webhook/(telegram.*)$ /$1 break;
        proxy_pass http://127.0.0.1:22488;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Credentials true always;
    }

    location = /webhook/heleket {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=UTF-8";
            return 204;
        }

        proxy_pass http://127.0.0.1:17555;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Credentials true always;
    }

    location = /old { return 404; }
    location ^~ /old/ { return 404; }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/youtradecs.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youtradecs.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name youtradecs.xyz www.youtradecs.xyz;
    server_tokens off;

    location = /old { return 404; }
    location ^~ /old/ { return 404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name docs.youtradecs.xyz;
    server_tokens off;

    root /var/www/youtradecs-docs;
    index index.html;

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    ssl_certificate /etc/letsencrypt/live/docs.youtradecs.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.youtradecs.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name docs.youtradecs.xyz;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/youtradecs-docs;
        try_files $uri =404;
    }

    location / { return 301 https://docs.youtradecs.xyz$request_uri; }
}

# Старый frontend доступен только с самого сервера. При SSH port forwarding
# соединение также приходит на loopback. Любой внешний запрос получает 404.
server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;

    if ($remote_addr !~ ^(127\.0\.0\.1|::1)$) { return 404; }

    root /var/www/html/dist;
    index index.html;

    location = /old { return 308 /old/; }
    location = /old/ {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    # Полный прежний API доступен только локальному старому frontend.
    location = /api { return 308 /api/; }
    location ^~ /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=UTF-8";
            return 204;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Credentials true always;
    }

    # Старый bundle собран для корня и загружает /assets/* без /old.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location = /favicon.ico { try_files $uri =404; }
    location = /manifest.json { try_files $uri =404; }

    # Поддержка внутренних SPA-маршрутов старого frontend.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
