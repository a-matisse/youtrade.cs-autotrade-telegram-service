    <title>Y.CS — автоматизация торговли скинами CS2</title>
    <style id="app-loader-styles">
      html.app-probing,html.app-loading{overflow:hidden;background:#111412}
      html.app-probing[data-boot-theme="light"],html.app-loading[data-boot-theme="light"]{background:#f3f2ee}
      html.app-probing #root,html.app-loading #root{opacity:0}
      html.app-loading .app-loader[hidden]{display:grid}
      html.app-entering #root{animation:app-content-enter .38s cubic-bezier(.2,.7,.2,1) both}
      .app-loader{--boot-paper:#111412;--boot-ink:#e7eae6;--boot-muted:#a0a7a2;--boot-grid:#2a302c55;--boot-track:#343d36;position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;background-color:var(--boot-paper);background-image:linear-gradient(var(--boot-grid) 1px,transparent 1px),linear-gradient(90deg,var(--boot-grid) 1px,transparent 1px);background-size:40px 40px;color:var(--boot-ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
      .app-loader[hidden],.app-loader [hidden]{display:none}
      html[data-boot-theme="light"] .app-loader{--boot-paper:#f3f2ee;--boot-ink:#171819;--boot-muted:#686a68;--boot-grid:#d8dcd666;--boot-track:#c3cbc4}
      .app-loader-content{width:min(320px,100%);animation:app-loader-enter .28s cubic-bezier(.2,.7,.2,1) both}
      .app-loader-brand{font-size:56px;font-weight:750;line-height:1;letter-spacing:-.06em}
      .app-loader p{margin:20px 0 28px;color:var(--boot-muted);font-size:14px;line-height:1.6}
      .app-loader-track{height:3px;overflow:hidden;background:var(--boot-track)}
      .app-loader-track span{display:block;width:40%;height:100%;background:#b8323a;animation:app-boot-progress 1.2s ease-in-out infinite alternate}
      .app-loader a{display:inline-flex;min-height:44px;align-items:center;padding:0 16px;border:1px solid #b8323a;border-radius:4px;background:#b8323a;color:#fff;font-size:14px;font-weight:700;text-decoration:none}
      .app-loader a:focus-visible{outline:2px solid var(--boot-ink);outline-offset:4px}
      .app-loader[data-state="ready"]{opacity:0;pointer-events:none;transition:opacity .38s ease}
      .app-loader[data-state="ready"] .app-loader-content{animation:app-loader-leave .38s ease both}
      .app-loader[data-state="ready"] .app-loader-track span{width:100%;transform:none;animation:none}
      @keyframes app-boot-progress{from{transform:translateX(0)}to{transform:translateX(150%)}}
      @keyframes app-loader-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      @keyframes app-loader-leave{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-8px)}}
      @keyframes app-content-enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      @media(prefers-reduced-motion:reduce){.app-loader-content,.app-loader-track span,html.app-entering #root{animation:none}.app-loader[data-state="ready"]{transition:none}}
    </style>
    <script src="/app-loader.js" data-entry="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loader" class="app-loader" hidden role="status" aria-live="polite">
      <div class="app-loader-content">
        <div class="app-loader-brand">Y.CS</div>
        <p data-loader-message>Загружаем приложение</p>
        <div class="app-loader-track" role="progressbar" aria-label="Загрузка Y.CS"><span></span></div>
        <a href="" hidden>Обновить страницу</a>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
