purpose:
  stands_in_for: Local Y.CS web backend described by patches 7 and 8.
  unblocks: Browser verification of authentication, session handling and the financial dashboard with synthetic data.
assumptions:
  - id: local-manual-preview
    status: supported
    claim: The Vite development server can serve the dashboard, sign-in flow and documents from the local Postman simulation.
    reason: The preview launcher points Vite at the simulation, which serves synthetic session credentials and sample images on the same browser origin.
    verification: Chrome opened a protected URL as a guest, loaded sign-in images, followed the test callback, selected a portfolio, restored the session on reload and accepted a sample document. The browser issued API requests only to the local Vite origin.
    source: scripts/run-webapp.ps1; webapp/vite.config.ts; postman/mocks/web-auth/default.js
    updated_at: "2026-11-23"
  - id: financial-dashboard
    status: supported
    claim: The dashboard uses the five authenticated portfolio routes from patch 8 and can display available financial data when capital history fails.
    reason: The frontend follows the published contract and the local mock returns synthetic summaries, positions, performance, history and wallet data.
    verification: Chrome verified the portfolio filter, the history period, today's performance request, position status and cursor, chart gaps and a history 503 alongside the available performance and wallet. The privacy control masked dollar amounts in the header, charts and table, kept percentages visible and stayed enabled after reload. The mobile layout omitted the positions request. The run used the local mock.
    source: docs/external-patches/lis-tm/8/portfolio-api.md; postman/mocks/web-auth/default.js; webapp/scripts/check-auth.mjs
    updated_at: "2026-11-23"
  - id: public-operation-feed
    status: supported
    claim: Desktop sign-in rotates through the public operation feed and keeps the most recent snapshot on a server error.
    reason: The existing local fixture supplies initial, updated, empty and unavailable snapshots and responds to a matching ETag with 304.
    verification: Chromium verified one loader during the first request, a gradual fill of eight different skins across nine slots, and an immediate fill with reduced motion. Rotation starts after the fill and continues across distant slots. The checks also covered the cooldown before a departing skin can return, hover and keyboard hold, and no polling in the hidden tab or mobile layout. Clicking the image or pressing Enter on the card copies the name without showing it. Clipboard feedback was also verified. The fixture exercised an empty response and a 503 with a previous snapshot. A prior direct request pair verified 200 and 304 against the fixture. These checks used the local fixture.
    source: docs/external-patches/lis-tm/7/landing-api.md; postman/mocks/web-auth/default.js; webapp/scripts/check-auth.mjs
    updated_at: "2026-11-22"
  - id: shared-error-notifications
    status: supported
    claim: Operation errors use a single notification host in the React site shell, including OAuth return and document acceptance failures.
    reason: Local Chromium checks verified a fixed toast within the mobile viewport, manual closing, fresh login after closing, and a document-save failure using the same host. Both theme screenshots were reviewed and the production build passed on 2026-11-20.
    verification: Auth and session scenarios passed with the local fixture. Chrome verified dismissal when changing the document language and when navigating away from documents or a dashboard section with an error.
    source: webapp/src/components/ui/SiteNotifications.tsx; webapp/src/components/ui/Toast.tsx; webapp/scripts/check-auth.mjs
    updated_at: "2026-11-20"
  - id: oauth-failure-frontend-return
    status: supported
    claim: The frontend handles public error codes on auth/callback without refreshing credentials, returns to the login form and permits a fresh login.
    reason: Browser checks exercised cancellation, expiry, temporary failure and unknown codes, plus a delayed callback with no refresh cookie. Existing success, session and layout scenarios passed on 2026-11-20.
    verification: This tests the frontend through synthetic callback navigation only. The current lis-tm callback still returns HTTP 401; its redirect to the frontend error URL is a proposed integration described in webapp/README.md and was not implemented here.
    source: webapp/scripts/check-auth.mjs; webapp/src/auth/session.ts; webapp/src/pages/AuthCallbackPage.tsx; webapp/README.md
    updated_at: "2026-11-20"
  - id: site-wide-control-review
    status: supported
    claim: The landing, document controls and learning actions use shared button styling, with card hover movement preserved outside reduced-motion mode.
    reason: Local Chromium review exercised language and document selection, keyboard focus, CTA contrast, 44px actions, touch sizing and overflow at 320/375/768/1280 in both themes. Screenshots were inspected. The video provider was blocked during this layout review, so it does not establish real YouTube playback.
    verification: On 2026-11-20 both builds and the existing auth/startup checks passed. The standalone error-page check also passed 17 generated pages and 36 responsive cases without JavaScript. No production authentication or backend requests were used.
    source: shared/site/buttons.css; webapp/src/landing.css; webapp/src/offers-document.css; webapp/scripts/prerender.mjs; user-docs/.vitepress/theme/custom.css; webapp/scripts/check-auth.mjs
    updated_at: "2026-11-20"
  - id: shared-button-presentation
    status: supported
    claim: Header controls use shared button states in both themes while keeping the compact header and usable form action size in the checked Chromium layouts.
    reason: Browser checks measure contrast, hover/pressed/focus states, header geometry and the login form action at widths 320/375/768/960/1280; main and learning pages use shared CSS and SVG.
    verification: On 2026-11-20, both frontend builds and check-auth.mjs passed with the local fixture and no page errors. Checked screenshots of desktop themes, hover, mobile login and learning. check-startup.mjs also passed. These checks do not establish real Telegram authentication or compatibility with every browser.
    source: shared/site/buttons.css; shared/site/icons.svg; webapp/scripts/check-auth.mjs; webapp/scripts/check-startup.mjs
    updated_at: "2026-11-20"
  - id: avatar-header-browser-behavior
    status: supported
    claim: The main-site frontend shows an avatar menu with fallbacks and keeps navigation aligned across guest and authenticated views in the browser scenarios run.
    reason: Browser assertions exercise separate authentication and profile responses; learning uses the same presentation but links to the main cabinet without reading its session.
    verification: Earlier on 2026-11-20 the tests covered a proposed cross-domain session API. That proposal was removed after the user supplied a different profile protocol. Its passing simulation never established production support. Current scenarios use only the documented Bearer profile endpoint, preserve signed image URLs and verify bounded renewal and missing-profile behavior. Local Chromium verified navigation to the dashboard by clicking, tapping or pressing Enter on the avatar, and opening the profile menu by tapping the avatar in the dashboard.
    source: webapp/scripts/check-auth.mjs; shared/site/menus.ts; shared/site/profile.ts; postman/mocks/web-auth/default.js
    updated_at: "2026-11-20"
  - id: proposed-header-profile-backend
    status: contradicted
    claim: The current backend protocol provides profile claims in auth/me and cookie-authenticated session methods for the learning origin.
    reason: The user removed the earlier profile proposal. The updated authoritative web-auth contract separates identity in auth/me from the Bearer-authenticated user/profile response and does not define cross-origin session methods.
    verification: On 2026-11-20 read updated web-auth-frontend.md and sibling WebUserProfileController/WebUserProfileDto. Removed the proposed session client, learning-session code and mock routes. Learning now links to the main cabinet; no cross-origin credentials are transferred. Earlier tests were only evidence about the retired fixture.
    source: docs/external-patches/lis-tm/7/web-auth-frontend.md; webapp/src/api/services.ts; shared/site/profile.ts
    updated_at: "2026-11-20"
  - id: session-contract
    status: supported
    claim: Patch 7 provides a refresh-cookie flow and requires renewing both access and refresh credentials together.
    reason: The maintained backend contract explicitly defines the flow; the fixture implements its documented response shapes.
    verification: Read patch 7 and the sibling backend auth controller on 2026-11-19. Browser checks exercise the frontend against a local fixture, not a deployed backend.
    source: docs/external-patches/lis-tm/7/web-auth-frontend.md; postman/mocks/web-auth/default.js; webapp/scripts/check-auth.mjs
    updated_at: "2026-11-19"
  - id: telegram-provider
    status: unknown
    claim: Production BotFather configuration, PKCE, ID-token validation and HTTPS callback complete successfully with a real Telegram account.
    reason: The local fixture replaces approval with a redirect and fake credentials; it does not model Telegram cryptography or deployed configuration.
    verification: No live Telegram login or production credentials were used. Check the complete flow on the configured HTTPS origin before deployment.
    source: docs/external-patches/lis-tm/7/web-auth.md; postman/mocks/web-auth/default.js
    updated_at: "2026-11-19"
  - id: browser-session-behavior
    status: supported
    claim: The frontend coordinates refresh and clears sessions correctly in the modeled Chromium browser scenarios.
    reason: Browser assertions inspect both rendered screens and the fixture's request journal, including exactly one refresh during simultaneous expired requests.
    verification: On 2026-11-19, check-auth.mjs passed guest and callback flows, memory-only access, HttpOnly cookie, reload, concurrent tabs, a new callback with an existing peer, expired access, no automatic write replay, server logout, login propagation, lost refresh reply, independent devices, 503/403 messages and mobile layout. No page errors were recorded. This does not establish deployed backend behavior or compatibility with every browser.
    source: webapp/scripts/check-auth.mjs; webapp/src/auth/session.ts; postman/mocks/web-auth/default.js
    updated_at: "2026-11-19"
  - id: fixture-ownership
    status: supported
    claim: This is a repository-owned fixture derived from the supplied backend contract.
    reason: No published provider mock was used. The installed CLI has no status command; no workspace lookup, publication or binding was performed.
    verification: Postman CLI 1.73.0 runs the local simulation on port 4921. All credentials and the Telegram approval route are synthetic.
    source: postman/mocks/web-auth/config.yaml; postman/simulations/web-auth.sim.yaml
    updated_at: "2026-11-19"
  - id: shared-site-shell
    status: supported
    claim: The site header remains visible during session restoration and persists across the tested frontend routes.
    reason: Browser checks preserve a marker on the header DOM node across landing, login and document navigation, while the delayed refresh scenario keeps the header visible above its content placeholder.
    verification: On 2026-11-20, check-auth.mjs passed shared shell, theme handoff between local-served main and learning origins, viewport widths 320/375/768/960/1280 and the previous session scenarios. check-startup.mjs passed cold startup, ready transition, cached reload and internal navigation without another startup screen. These runs use the repository-owned fixture and Chromium, not production Telegram.
    source: webapp/scripts/check-auth.mjs; webapp/scripts/check-startup.mjs; shared/site/; user-docs/.vitepress/theme/
    updated_at: "2026-11-20"
  - id: slim-header-and-currency
    status: supported
    claim: The combined header and Steam rate strip fit within 65px on desktop and 61px on mobile in the checked Chromium viewports.
    reason: Layout assertions measure the complete header, confirm that the rate strip is above navigation and verify that the header stays at the top during scrolling on main and learning pages.
    verification: On 2026-11-20, check-auth.mjs passed at widths 320/375/768/960/1280 using a synthetic RUB rate. The measured ticker animation duration was 60 seconds, and the existing session scenarios passed without page errors. The learning-domain production proxy was added to the Nginx template; nginx -t was not run because Nginx is unavailable locally.
    source: shared/site/header.css; shared/site/currency.css; shared/site/currency.ts; docs/nginx-youtradecs.xyz.conf; webapp/scripts/check-auth.mjs
    updated_at: "2026-11-20"
