server.port=19884

tg.token.main=${TG_TOKEN_MAIN}
tg.token.alt=${TG_TOKEN_ALT}
yt.message.endpoint=${YOUTRADE_MESSAGES_ENDPOINT}

spring.datasource.keygen.url=${DB_HOST_TERTIARY}
spring.datasource.keygen.username=${DB_UNAME}
spring.datasource.keygen.password=${DB_PASSWORD}

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=25555
spring.data.redis.username=${DB_UNAME}
spring.data.redis.password=${DB_PASSWORD}

youtrade.redis.stream.telegram.name=telegram-updates
youtrade.redis.stream.telegram.group=telegram-group
youtrade.redis.stream.notification.name=notification-stream
youtrade.redis.stream.notification.group=notification-group
telegram.redis.consumerPrefix=consumer

# MinIO
youtrade.minio.url=${YOUTRADE_MINIO}
youtrade.minio.username=${DB_UNAME}
youtrade.minio.password=${DB_PASSWORD}